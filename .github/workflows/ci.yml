name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The Linux x86_64 presets of CMakePresets.json: gcc 13 unless noted.
        preset: [debug, release, asan, tsan, noexc, pthread-tls, clang-release]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtest-dev

      # Sanitizer shadow memory layouts reject the 32-bit mmap ASLR entropy of
      # recent runner kernels ("unexpected memory mapping", endless DEADLYSIGNAL).
      - name: Lower mmap randomization
        if: matrix.preset == 'asan' || matrix.preset == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      # Serial on purpose: most tests start several worker threads and some
      # bound latencies, which a 2-4 vCPU runner running tests side by side
      # would oversubscribe.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
